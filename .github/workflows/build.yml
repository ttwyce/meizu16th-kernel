name: build-kernel
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          df -h /
      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-9-aarch64-linux-gnu g++-9-aarch64-linux-gnu libssl-dev libelf-dev device-tree-compiler bc bison flex
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-9 /usr/local/bin/aarch64-linux-gnu-gcc
          sudo ln -sf /usr/bin/aarch64-linux-gnu-g++-9 /usr/local/bin/aarch64-linux-gnu-g++
          aarch64-linux-gnu-gcc --version | head -1
      - name: Clone kernel source
        run: git clone --depth 1 -b topaz https://github.com/meizufuckers/android_kernel_meizu_sdm845.git kernel
      - name: Apply ppdone fix
        run: cd kernel && git apply ../ppdone_fix.patch && git diff --stat
      - name: Fix gcc-wrapper for python3
        run: |
          printf '#!/usr/bin/env python3\nimport os, sys\nos.execvp(sys.argv[1], sys.argv[1:])\n' > kernel/scripts/gcc-wrapper.py
          chmod +x kernel/scripts/gcc-wrapper.py
      - name: Fix missing transitive includes
        run: |
          cd kernel
          # 4.9.227 树里 dwc3-msm.c 少了 pm_qos.h 的间接引入
          grep -q "linux/pm_qos.h" drivers/usb/dwc3/dwc3-msm.c || \
            sed -i '0,/^#include/s//#include <linux\/pm_qos.h>\n#include/' drivers/usb/dwc3/dwc3-msm.c
          head -3 drivers/usb/dwc3/dwc3-msm.c
      - name: Configure
        run: |
          cd kernel
          cp ../device_config .config
          ./scripts/config --disable BTFM_SLIM
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=aarch64-linux-gnu-gcc-9
          make olddefconfig
          echo "=== kernelrelease ==="
          make -s kernelrelease
      - name: Build Image
        run: |
          cd kernel
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=aarch64-linux-gnu-gcc-9
          # trace 头 TRACE_INCLUDE_PATH=. 需要各自目录；相机/音频子树互相 include 需要整棵子树
          # 精确最小集合（避免 -I 过多导致 trace.h 等通用名头文件互相遮蔽）
          TRACEHDRS=$(grep -rhoE 'TRACE_INCLUDE_FILE[[:space:]]+[A-Za-z0-9_.]+' --include='*.h' --include='*.c' drivers techpack 2>/dev/null | awk '{print $2}' | sort -u)
          EXTRA=""
          for hd in $TRACEHDRS; do
            d=$(find drivers techpack \( -name "$hd" -o -name "$hd.h" \) -printf '%h\n' 2>/dev/null | head -1)
            [ -n "$d" ] && EXTRA="$EXTRA -I$d"
          done
          EXTRA="$EXTRA -Itechpack/audio/asoc -Itechpack/audio/asoc/codecs"
          EXTRA="$EXTRA -Idrivers/usb/gadget -Idrivers/media/platform/msm/camera/cam_core"
          EXTRA=$(echo $EXTRA | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "include dirs: $(echo $EXTRA | wc -w)"
          make -j$(nproc) Image KCFLAGS="$EXTRA -Wno-error -Wno-error=implicit-function-declaration"
          ls -l arch/arm64/boot/Image
          df -h /
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-Image
          path: kernel/arch/arm64/boot/Image
          if-no-files-found: error